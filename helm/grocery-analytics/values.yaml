namespace: spark-jobs

image:
  repository: docker.io/nouh23/grocery-analytics
  tag: latest
  pullPolicy: Always
  pullSecrets:
    - dockerhub-registry

spark:
  version: "4.3.0"
  applicationName: grocery-customer-aggregation
  mainApplicationFile: local:///opt/spark/app/grocery_analytics/app.py
  restartPolicy: Never
  timeToLiveSeconds: 300
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark
  executor:
    instances: 2
    cores: 1
    memory: 1g
