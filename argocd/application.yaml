apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grocery-analytics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nouh-21/Spark_Operator_grocery-analytics.git
    targetRevision: main
    path: helm/grocery-analytics
    helm:
      releaseName: grocery-analytics
  destination:
    server: https://kubernetes.default.svc
    namespace: spark-jobs
  # No syncPolicy: Argo CD detects OutOfSync and waits for a manual sync.
