name: CI and GitOps delivery

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/**"
      - "Dockerfile"
      - "requirements-dev.txt"
      - "helm/**"
      - ".github/workflows/ci-cd.yaml"
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "helm/grocery-analytics/values.yaml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src pytest -q

  build_scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: grocery-analytics:${{ github.sha }}
          outputs: type=docker,dest=/tmp/grocery-analytics.tar
      - name: Load image for scanning
        run: docker load --input /tmp/grocery-analytics.tar
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: grocery-analytics:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: grocery-image
          path: /tmp/grocery-analytics.tar
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grocery-image
          path: /tmp
      - name: Load scanned image
        run: docker load --input /tmp/grocery-analytics.tar
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/nouh23/grocery-analytics
          tags: |
            type=sha,format=long,prefix=
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      - name: Publish image with generated tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            [ -z "$image_tag" ] && continue
            docker tag "grocery-analytics:${GITHUB_SHA}" "$image_tag"
            docker push "$image_tag"
          done <<< "$IMAGE_TAGS"

  update_gitops:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update image tag in GitOps manifest
        run: |
          sed -i "s/^  tag: .*/  tag: \"${GITHUB_SHA}\"/" helm/grocery-analytics/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/grocery-analytics/values.yaml
          git diff --cached --quiet || git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push
